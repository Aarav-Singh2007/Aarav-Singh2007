# Put this at .github/workflows/snake.yml in your Aarav-Singh2007/Aarav-Singh2007 repo.
# It redraws the contribution snake every day and pushes the SVGs to an "output" branch.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:      # lets you run it by hand from the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#f4a62a&color_dots=#ebedf0,#fde3b0,#f8c56b,#f4a62a,#c27c12
            dist/snake-dark.svg?palette=github-dark&color_snake=#f4a62a&color_dots=#161b22,#4a3413,#7a5419,#b97b20,#f4a62a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}